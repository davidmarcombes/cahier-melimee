# programme-map.yaml — hand corrections for scripts/programme-coverage.js (npm run coverage:programme).
#
# The script matches each series to the programme items of its level (docs/maths_<level>.md) by text
# similarity. When it gets one wrong or finds nothing, correct it here:
#
#   pin:   series → the items it covers (replaces the automatic match)
#   skip:  series that cover no programme item, with the reason (logic games, missing item in the doc…)
#
# Series key: "level/slug", or "level/topic/slug" when the slug exists in two folders.
# Item reference: a fragment of the item text (accents and case ignored; an exact text wins over
# fragments), "§Section title" for every item of a section, or an item id ("cm1:division#3",
# shown by `--level=<level>` and in reports/programme-coverage.json).
# `node scripts/programme-coverage.js --series=<slug>` shows the 5 best automatic candidates.

