<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Inter;
        src: url('../../src/assets/fonts/inter-roman-subset.woff2') format('woff2');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: Inter, system-ui, sans-serif;
      }
      /* Everything on the vertical axis x = 600, inside the centre square (x 285–915) that WhatsApp / iMessage keep */
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #fbf7ef;
      }
      .card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(to bottom, transparent 0 41px, #d7e6f0 41px 42px);
        opacity: 0.75;
      }
      .card::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 60px;
        width: 3px;
        background: #e8a3a3;
        opacity: 0.7;
      }
      .disc {
        position: absolute;
        left: 600px;
        top: 315px;
        width: 560px;
        height: 560px;
        margin: -280px 0 0 -280px;
        border-radius: 50%;
        background: #deeefa;
      }
      .stack {
        position: absolute;
        inset: 0;
        justify-content: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .salto {
        width: 297px;
        height: 299px;
        filter: drop-shadow(0 12px 12px rgba(46, 57, 64, 0.16));
      }
      h1 {
        margin: 14px 0 10px;
        font-size: 60px;
        line-height: 1;
        font-weight: 800;
        color: #2e3940;
        letter-spacing: -1.5px;
      }
      h1 span {
        color: #2a86bf;
      }
      p {
        margin: 0;
        font-size: 28px;
        color: #3c6680;
        font-weight: 500;
      }
      .pills {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      .pill {
        font-size: 22px;
        font-weight: 700;
        padding: 7px 16px;
        border-radius: 999px;
        background: #bf812a;
        color: white;
      }
      .pill.alt {
        background: white;
        color: #bf812a;
        border: 3px solid #bf812a;
        padding: 4px 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="disc"></div>
      <div class="stack">
        <img class="salto" src="salto.png" alt="" />
        <h1>Le Cahier de <span>Mélimée</span></h1>
        <p>Des maths pour s'entraîner, du CP au CM2</p>
      </div>
    </div>
  </body>
</html>
