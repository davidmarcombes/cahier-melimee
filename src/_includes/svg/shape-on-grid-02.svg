<svg width="320" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--cs, #94a3b8)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="var(--sf, white)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

<!-- L-shape: list each corner as "x,y" separated by spaces -->
<polygon
  points="40,40 200,40 200,80 280,80 280,120 200,120 200,200  80,200  80,120  40,120"
  fill="color-mix(in srgb, var(--p, #2a85bf) 10%, transparent)"
 stroke="var(--p, #2a85bf)"  stroke-width="2"/>
</svg>