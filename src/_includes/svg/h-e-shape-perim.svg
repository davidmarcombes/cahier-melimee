<!--
  Body 6 cm × 6 cm with a 2 cm notch on the right and a 2 cm tab on the left — to scale, 30 px per cm.
  Given: bottom 6 cm, total height 6 cm (dimension line), top-left and bottom-left sides 2 cm,
  tab depth 2 cm, notch depth 2 cm. To deduce: tab / notch height 6 − 2 − 2 = 2 cm, top 6 cm.
  Perimeter = 6 + 2 + 2 + 2 + 2 + 2 + 6 + 2 + 2 + 2 + 2 + 2 = 32 cm
  (The old figure never gave the tab depth, so 32 could not be found.)
-->
<svg viewBox="0 0 350 250" width="350" height="250" xmlns="http://www.w3.org/2000/svg">
  <path d="M90,30 H270 V90 H210 V150 H270 V210 H90 V150 H30 V90 H90 Z"
    fill="color-mix(in srgb, #2a85bf 10%, transparent)" stroke="#2a85bf" stroke-width="2"/>

  <g stroke="var(--ct, #334155)" stroke-width="1.2">
    <!-- total height -->
    <line x1="300" y1="30" x2="300" y2="210"/>
    <line x1="293" y1="30" x2="307" y2="30"/>
    <line x1="293" y1="210" x2="307" y2="210"/>
    <!-- tab depth -->
    <line x1="30" y1="106" x2="90" y2="106"/>
    <line x1="30" y1="100" x2="30" y2="112"/>
    <line x1="90" y1="100" x2="90" y2="112"/>
    <!-- notch depth -->
    <line x1="210" y1="106" x2="270" y2="106"/>
    <line x1="210" y1="100" x2="210" y2="112"/>
    <line x1="270" y1="100" x2="270" y2="112"/>
  </g>

  <g font-family="Arial" font-size="17" fill="var(--ct, #334155)">
    <text x="320" y="120" text-anchor="middle" transform="rotate(90, 320, 120)">6 cm</text>
    <text x="180" y="235" text-anchor="middle">6 cm</text>
    <text x="82" y="66" text-anchor="end">2 cm</text>
    <text x="82" y="196" text-anchor="end">2 cm</text>
    <!-- tab and notch depths, under their dimension lines -->
    <text x="60" y="132" text-anchor="middle">2 cm</text>
    <text x="240" y="132" text-anchor="middle">2 cm</text>
  </g>
</svg>
