<!--
  U-shape (opening at top) for perimeter exercises.
  All angles are right angles.
  Sides (clockwise from top-left of left arm):
    top-left: 2 cm | notch-down: 3 cm | notch-bottom: 4 cm
    notch-up: 3 cm | top-right: 3 cm | right: 6 cm | bottom: 9 cm | left: 6 cm
  Perimeter = 2+3+4+3+3+6+9+6 = 36 cm
  Scale: 10 px per cm.
    A(20,20) B(40,20) C(40,50) D(80,50) E(80,20) F(110,20) G(110,80) H(20,80)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 100" width="130" height="100">
  <polygon points="20,20 40,20 40,50 80,50 80,20 110,20 110,80 20,80"
           fill="var(--sf, white)" stroke="var(--ct, #334155)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Right-angle marks -->
  <g fill="none" stroke="var(--ct, #334155)" stroke-width="1">
    <!-- A top-left -->
    <path d="M20,24 L24,24 L24,20"/>
    <!-- B outer-left of notch (concave) -->
    <path d="M40,24 L36,24 L36,20"/>
    <!-- C notch inner-left (concave) -->
    <path d="M40,46 L44,46 L44,50"/>
    <!-- D notch inner-right (concave) -->
    <path d="M80,46 L76,46 L76,50"/>
    <!-- E outer-right of notch (concave) -->
    <path d="M80,24 L84,24 L84,20"/>
    <!-- F top-right -->
    <path d="M106,20 L106,24 L110,24"/>
    <!-- G bottom-right -->
    <path d="M110,76 L106,76 L106,80"/>
    <!-- H bottom-left -->
    <path d="M24,80 L24,76 L20,76"/>
  </g>

  <!-- Notch interior labels (staggered to avoid overlap) -->
  <text x="47"  y="27"  text-anchor="middle" font-family="Arial" font-size="9" fill="var(--ct, #334155)">3 cm</text>
  <text x="60"  y="44"  text-anchor="middle" font-family="Arial" font-size="9" fill="var(--ct, #334155)">4 cm</text>
  <text x="73"  y="27"  text-anchor="middle" font-family="Arial" font-size="9" fill="var(--ct, #334155)">3 cm</text>

  <!-- Outer side labels -->
  <text x="30"  y="13"  text-anchor="middle" font-family="Arial" font-size="9" fill="var(--ct, #334155)">2 cm</text>
  <text x="95"  y="13"  text-anchor="middle" font-family="Arial" font-size="9" fill="var(--ct, #334155)">3 cm</text>
  <text x="119" y="52"  text-anchor="start"  font-family="Arial" font-size="9" fill="var(--ct, #334155)">6 cm</text>
  <text x="65"  y="93"  text-anchor="middle" font-family="Arial" font-size="9" fill="var(--ct, #334155)">9 cm</text>
  <text x="11"  y="52"  text-anchor="end"    font-family="Arial" font-size="9" fill="var(--ct, #334155)">6 cm</text>
</svg>
