<!--
  I-shape for perimeter exercises — drawn to scale, 30 px per cm.
  Given: total width 8 cm, total height 8 cm (dimension lines), each flange 2 cm thick, web 2 cm wide.
  To deduce: notch depth (8 − 2) ÷ 2 = 3 cm, web height 8 − 2 − 2 = 4 cm.
  Perimeter = 8 + 2 + 3 + 4 + 3 + 2 + 8 + 2 + 3 + 4 + 3 + 2 = 44 cm
  (The old figure had « 6 cm » next to the web and a web drawn taller than labelled: 32 or 40.)
-->
<svg viewBox="0 0 370 335" width="370" height="335" xmlns="http://www.w3.org/2000/svg">
  <path d="M50,30 H290 V90 H200 V210 H290 V270 H50 V210 H140 V90 H50 Z"
    fill="color-mix(in srgb, #2a85bf 10%, transparent)" stroke="#2a85bf" stroke-width="2"/>

  <g stroke="var(--ct, #334155)" stroke-width="1.2">
    <!-- total height -->
    <line x1="320" y1="30" x2="320" y2="270"/>
    <line x1="313" y1="30" x2="327" y2="30"/>
    <line x1="313" y1="270" x2="327" y2="270"/>
    <!-- total width -->
    <line x1="50" y1="295" x2="290" y2="295"/>
    <line x1="50" y1="288" x2="50" y2="302"/>
    <line x1="290" y1="288" x2="290" y2="302"/>
    <!-- web width -->
    <line x1="140" y1="150" x2="200" y2="150"/>
    <line x1="140" y1="144" x2="140" y2="156"/>
    <line x1="200" y1="144" x2="200" y2="156"/>
  </g>

  <g font-family="Arial" font-size="17" fill="var(--ct, #334155)">
    <text x="340" y="150" text-anchor="middle" transform="rotate(90, 340, 150)">8 cm</text>
    <text x="170" y="322" text-anchor="middle">8 cm</text>
    <text x="42" y="66" text-anchor="end">2 cm</text>
    <text x="42" y="246" text-anchor="end">2 cm</text>
    <text x="170" y="140" text-anchor="middle">2 cm</text>
  </g>
</svg>
