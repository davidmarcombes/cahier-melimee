<svg viewBox="0 0 280 310" width="280" height="310" xmlns="http://www.w3.org/2000/svg">
  <!-- L-shape: 7cm wide, 8cm tall, step at 2cm×5cm -->
  <polygon points="30,20 90,20 90,170 240,170 240,260 30,260"
    fill="color-mix(in srgb, var(--p, #2a85bf) 10%, transparent)"
    stroke="var(--p, #2a85bf)" stroke-width="2"/>
  <!-- Labels -->
  <text x="60" y="12" font-family="monospace" font-size="16" text-anchor="middle" fill="var(--ct, #334155)">2 cm</text>
  <text x="20" y="145" font-family="monospace" font-size="16" text-anchor="end" fill="var(--ct, #334155)">8 cm</text>
  <text x="135" y="280" font-family="monospace" font-size="16" text-anchor="middle" fill="var(--ct, #334155)">7 cm</text>
  <text x="250" y="220" font-family="monospace" font-size="16" text-anchor="start" fill="var(--ct, #334155)">3 cm</text>
</svg>
